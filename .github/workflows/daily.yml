name: Daily Ghost Query Run
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Run AI script
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        run: python main.py

      - name: Commit new post and state file
        run: |
          git config user.name "GhostQuery Bot"
          git config user.email "actions@github.com"
          git add _posts/ processed_questions.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Autonomous AI post"
          git push

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
