name: Daily Ghost Query Run
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      # NOTE: max-parallel: 1 is load-bearing, not a style choice — every
      # job below does checkout -> write -> commit -> push against the
      # SAME branch. Running the matrix in parallel means two jobs race
      # to push and one of them fails/force-conflicts. Keeping it
      # sequential costs a few extra minutes of runtime, which is free
      # against the $0/month model; a flaky nightly job is not.
      max-parallel: 1
      fail-fast: false
      matrix:
        site: [stackoverflow, serverfault, askubuntu, superuser]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests google-genai
      - name: Run AI script (${{ matrix.site }})
        env:
          SE_SITE: ${{ matrix.site }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
        run: python main.py
      - name: Commit new post and state file (${{ matrix.site }})
        run: |
          git config user.name "GhostQuery Bot"
          git config user.email "actions@github.com"
          # Pull immediately before committing, since the previous matrix
          # job in this sequential run just pushed its own commit.
          # --autostash is required here: main.py has already written the
          # new post + rewritten processed_questions_{site}.json by this
          # point, so the working tree is dirty and a plain `pull --rebase`
          # refuses to run. --autostash stashes those changes, rebases,
          # then reapplies them on top.
          git pull --rebase --autostash origin main
          git add _posts/ processed_questions_*.json 2>/dev/null || true
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Autonomous AI post (${{ matrix.site }})"
          git push
  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
