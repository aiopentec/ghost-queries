name: Daily Ghost Query Run
on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to run it manually right now

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows the script to save the new blog post
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install requests google-generativeai
      
      - name: Run AI Script
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          AFFILIATE_LINK: ${{ secrets.AFFILIATE_LINK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py
      
      - name: Commit new post to website
        run: |
          git config user.name "GhostQuery Bot"
          git config user.email "actions@github.com"
          git add _posts/
          git commit -m "Autonomous AI Post" || echo "No changes to commit"
          git push
